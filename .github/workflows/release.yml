name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact: dist/MuseScore-Studio-Rich-Presence-win-x64.exe
          - label: macOS Apple Silicon
            os: macos-latest
            artifact: dist/MuseScore-Studio-Rich-Presence-mac-arm64.dmg
          - label: macOS Intel
            os: macos-15-intel
            artifact: dist/MuseScore-Studio-Rich-Presence-mac-x64.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.label }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Update Rolling Latest Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" \
              -f sha="${{ github.sha }}" \
              -F force=true
            gh release upload latest artifacts/* --clobber
            gh release edit latest \
              --title "Latest Build" \
              --notes "Automated build from \`main\` (${{ github.sha }})." \
              --latest
          else
            gh release create latest artifacts/* \
              --target "${{ github.sha }}" \
              --title "Latest Build" \
              --notes "Automated build from \`main\` (${{ github.sha }})." \
              --latest
          fi
